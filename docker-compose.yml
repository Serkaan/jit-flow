services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    env_file: .env
    volumes: ["./data:/app/data"]
    ports: ["8080:8080"]
    restart: unless-stopped
  ui:
    build: .
    command: streamlit run app/ui.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    environment: ["API_URL=http://api:8080"]
    depends_on: [api]
    ports: ["8501:8501"]
    restart: unless-stopped
